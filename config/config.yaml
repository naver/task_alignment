# @package _global_
# Adapted from:
#   https://github.com/nik-dim/tall_masks/blob/master/config/config.yaml (MIT)
#     - extended with the task-alignment and proxy-dataset options
defaults:
- _self_
- method: sum

model: ViT-B-32
num_tasks: 8
specify_lambda: None
compute_tas: True
skip_tas: false
skip_eval: false
num_batches_tas: 1
tas_seed: 0
tas_batch_size: 128
tas_metric: l2

proxy_dataset_mode: per_task
proxy_shared_dataset: OpenImagesVal
proxy_task_to_dataset: {}

apply_lines: false

DATASETS: ''
DATASETS_VAL: ''

# utilities
cache_dir: None
world_size: 1
port: 12355
n_eval_points: 21
device: "cuda"
batch_size: 32
data_location: "/path/to/datasets/"
model_location: "/path/to/models/checkpoints/"
save_subfolder: ""

# Weights & Biases logging (optional, disabled by default).
# Enable with: python main.py ... wandb.enabled=true
wandb:
  enabled: false
  project: task-vectors
  entity: null
  group: ${model}
  mode: online
  dir: logs/

hydra:
  run:
    dir: ./logs/${model}/${method.name}/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweep:
    dir: ./logs/multirun/${now:%Y-%m-%d}/${now:%H-%M-%S}
    subdir: ${hydra.job.num}
